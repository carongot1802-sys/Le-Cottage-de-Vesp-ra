<link href="https://fonts.googleapis.com/css2?family=Chantelli+Antiqua&family=Montserrat:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ead8;--card:#faf4e6;--ink:#2b1a1a;--wine:#6d1a2c;--green:#1f3a2e;--line:#d9c9a8;--muted:#7a6a5a;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1412;--card:#251b19;--ink:#f1e6d0;--wine:#d9798b;--green:#8fb59f;--line:#4a3a33;--muted:#b3a490}}
:root[data-theme="dark"]{--bg:#1b1412;--card:#251b19;--ink:#f1e6d0;--wine:#d9798b;--green:#8fb59f;--line:#4a3a33;--muted:#b3a490}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;font-size:17px;line-height:1.75}
h1,h2,h3,.brand{font-family:'Chantelli Antiqua',Georgia,serif;font-weight:700}
header{position:relative;overflow:hidden;background:var(--hc,#1f3a2e);color:#f3ead8;text-align:center;padding:48px 20px 40px;border-bottom:6px double var(--wine)}
header>*{position:relative;z-index:1}
header>#hbg{position:absolute;z-index:0;top:-40px;left:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(var(--hblur,10px));display:none}
header>#hov{position:absolute;z-index:0;inset:0;background:var(--hc,#1f3a2e);opacity:var(--hov,1)}
#pgbg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;opacity:var(--pgop,.15);pointer-events:none;display:none}
.panel{background:var(--card);border:1px solid var(--line);padding:20px;margin-bottom:28px}
.panel h3{margin:0 0 10px;color:var(--wine)}
.panel label{display:block;font-size:14px;color:var(--muted);margin-top:12px}
.panel input[type=range]{width:100%}
.panel input[type=color]{width:56px;height:34px;padding:0;border:1px solid var(--line);background:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.cbtn{font-family:inherit;font-size:12px;background:transparent;color:#f3ead8;border:1px solid #d9a7b1;padding:3px 12px;border-radius:3px;cursor:pointer;margin:6px 8px 0 0}
.crow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.crow input{font:inherit;font-size:13px;padding:4px 8px;background:#ffffff1c;color:#f3ead8;border:1px solid #d9a7b188;border-radius:3px;min-width:0;flex:1}
.crow input::placeholder{color:#d9b8bf}
.crow b{cursor:pointer;padding:0 6px}
header h1{margin:0;font-size:clamp(28px,6vw,48px);letter-spacing:.02em;cursor:pointer}
header p{margin:10px 0 0;font-style:italic;opacity:.9}
main{max-width:980px;margin:0 auto;padding:32px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px #0002}
.cover{aspect-ratio:4/3;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--wine);font-size:40px;overflow:hidden}
.cover img,.cover video{width:100%;height:100%;object-fit:cover}
.card .in{padding:14px 16px 18px}
.tag{display:inline-block;color:var(--wine);font-size:13px;text-transform:uppercase;letter-spacing:.12em}
.card h2{margin:4px 0 6px;font-size:22px;line-height:1.25;color:var(--green)}
.date{color:var(--muted);font-size:14px}
.excerpt{margin:8px 0 0;font-size:15px;color:var(--ink);opacity:.85}
article{max-width:700px;margin:0 auto}
article h1{color:var(--wine);font-size:clamp(28px,5vw,40px);line-height:1.2;margin:.2em 0}
article p{margin:0 0 1.1em;white-space:pre-wrap}
.media{display:grid;gap:14px;margin:26px 0}
.media .m{cursor:zoom-in;border:1px solid var(--line);padding:6px;background:var(--card);position:relative}
.media img,.media video{width:100%;display:block}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;text-shadow:0 2px 12px #000;pointer-events:none}
button,.btn{font-family:inherit;font-size:15px;background:var(--wine);color:#fff;border:0;padding:9px 18px;border-radius:3px;cursor:pointer}
button.ghost{background:transparent;color:var(--wine);border:1px solid var(--wine)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;align-items:center}
.back{color:var(--green);cursor:pointer;background:none;border:0;padding:0;font-size:16px}
.empty{text-align:center;color:var(--muted);padding:60px 0}
#editor{background:var(--card);border:1px solid var(--line);padding:20px;margin-bottom:28px;display:none}
#editor input[type=text],#editor input[type=date],#editor textarea{width:100%;font:inherit;padding:9px;margin:4px 0 12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px}
#editor textarea{min-height:200px}
#editor label{font-size:14px;color:var(--muted)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.thumbs div{width:84px;height:84px;position:relative;border:1px solid var(--line);background:var(--bg)}
.thumbs img,.thumbs video{width:100%;height:100%;object-fit:cover}
.thumbs b{position:absolute;top:-6px;right:-6px;background:var(--wine);color:#fff;border-radius:50%;width:20px;height:20px;line-height:19px;text-align:center;font-size:13px;cursor:pointer}
#lb{position:fixed;inset:0;background:#000e;z-index:50;display:flex;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#lb img,#lb video{max-width:94vw;max-height:86vh;border:6px solid #f3ead8}
#lb .x,#lb .n{position:absolute;color:#fff;font-size:34px;background:none;padding:12px;opacity:.85}
#lb .x{top:calc(env(safe-area-inset-top,0px) + 6px);right:10px}#lb .p{left:6px}#lb .nx{right:6px}#lb .n{top:50%;transform:translateY(-50%)}
#lb .c{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);color:#f3ead8;font-size:14px}
nav{margin-top:18px;display:flex;justify-content:center;gap:26px}
nav a{color:#f3ead8;text-decoration:none;font-size:14px;letter-spacing:.14em;text-transform:uppercase;padding-bottom:3px;border-bottom:1px solid transparent;opacity:.75}
nav a.on,nav a:hover{opacity:1;border-bottom-color:#d9a7b1}
.filters{margin-bottom:26px}
.filters input{width:100%;font:inherit;padding:11px 16px;border:1px solid var(--line);border-radius:30px;background:var(--card);color:var(--ink);margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{cursor:pointer;font-size:14px;padding:5px 15px;border:1px solid var(--green);color:var(--green);border-radius:30px;user-select:none}
.chip.on{background:var(--green);color:var(--bg)}
.ta{width:100%;min-height:220px;font:inherit;padding:9px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:3px;margin-bottom:10px}
.lang{display:flex;gap:8px;margin-bottom:18px}
.sec{color:var(--wine);font-size:24px;margin:1.8em 0 .5em;border-bottom:1px solid var(--line);padding-bottom:6px}
.cv{padding-left:20px;margin:0}.cv li{margin-bottom:.8em}
#contact{margin:24px 0 0;padding:22px 24px 4px;background:#6d1a2c;color:#f3ead8;text-align:left;font-size:13px;line-height:1.6;border-top:4px double #d9a7b1}
#contact h2{margin:0 0 6px;color:#f3ead8;font-size:16px;letter-spacing:.04em}
#contact ul{list-style:none;padding:0;margin:0}#contact li{margin-bottom:.15em;word-break:break-word}
#contact a{color:#f3ead8;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#d9a7b1}
html[lang="vi"] main :is(h1,h2,h3){font-family:'Montserrat',system-ui,sans-serif;font-weight:700}
.gsw{display:inline-flex;margin-top:16px;border:1px solid #d9a7b1;border-radius:30px;overflow:hidden}
.gsw span{cursor:pointer;font-size:13px;letter-spacing:.12em;padding:4px 16px;color:#f3ead8;user-select:none}
.gsw span.on{background:#d9a7b1;color:#1f3a2e}
footer{text-align:left;background:#6d1a2c;color:#d9b8bf;font-size:12px;padding:6px 24px 22px}
.note{background:var(--card);border-left:4px solid var(--wine);padding:10px 14px;font-size:15px;margin-bottom:20px}

.fl{display:inline-block;width:1em;height:1em;vertical-align:-.14em;flex:none}
.fl.xs{width:.9em;height:.9em}
.orn{display:flex;justify-content:center;gap:.9em;margin-top:10px;font-size:18px;color:inherit;letter-spacing:0}
.orn .fl:nth-child(2){transform:scale(1.25) translateY(-1px)}
.pond{position:relative;max-width:720px;margin:0 auto;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px #1f3a2e33;aspect-ratio:720/340;background:#4f9a8a}
.pond svg{display:block;width:100%;height:100%}
.fx,.fy,.ff,.sit,.air,.lot,.rip{animation-duration:16s;animation-iteration-count:infinite}
.fx{animation-name:fxm;animation-timing-function:linear;transform:translate(150px,250px)}
.fy{animation-name:fym}
.ff{animation-name:ffm;animation-timing-function:step-end}
.sit{animation-name:sitm;animation-timing-function:step-end}
.air{animation-name:airm;animation-timing-function:step-end;opacity:0}
@keyframes fxm{0%,18.75%{transform:translate(150px,250px)}25%,43.75%{transform:translate(360px,282px)}50%,68.75%{transform:translate(572px,240px)}75%,93.75%{transform:translate(360px,282px)}100%{transform:translate(150px,250px)}}
@keyframes fym{0%,18.75%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}21.875%{transform:translateY(-52px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}25%,43.75%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}46.875%{transform:translateY(-52px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}50%,68.75%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}71.875%{transform:translateY(-52px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}75%,93.75%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}96.875%{transform:translateY(-52px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}100%{transform:translateY(0)}}
@keyframes ffm{0%{transform:scaleX(1)}60%{transform:scaleX(-1)}}
@keyframes sitm{0%{opacity:1}18.75%{opacity:0}25%{opacity:1}43.75%{opacity:0}50%{opacity:1}68.75%{opacity:0}75%{opacity:1}93.75%{opacity:0}}
@keyframes airm{0%{opacity:0}18.75%{opacity:1}25%{opacity:0}43.75%{opacity:1}50%{opacity:0}68.75%{opacity:1}75%{opacity:0}93.75%{opacity:1}}
.lot{animation-duration:6s;animation-timing-function:ease-in-out;animation-direction:alternate;animation-name:sway;transform-box:fill-box;transform-origin:50% 100%}
.l2{animation-delay:-2s}.l3{animation-delay:-4s}.l4{animation-delay:-1s}.l5{animation-delay:-3s}
@keyframes sway{from{rotate:-1.6deg}to{rotate:1.6deg}}
.rip{animation-duration:7s;animation-name:rip;animation-timing-function:ease-in-out}
.r2{animation-delay:-2.5s}.r3{animation-delay:-5s}
@keyframes rip{0%,100%{opacity:.15}50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.fx,.fy,.ff,.sit,.air,.lot,.rip{animation:none}.air{opacity:0}}

nav{flex-wrap:wrap}
header h1{display:flex;align-items:center;justify-content:center;gap:.4em}
#tagline .fl{color:inherit}
.welcome{max-width:760px;margin:0 auto;text-align:center}
.crest{width:112px;height:134px;margin:4px auto 6px;display:block;filter:drop-shadow(0 6px 10px #5b2d9633)}
.welcome h1{color:var(--wine);font-size:clamp(28px,5.4vw,42px);line-height:1.2;margin:.2em 0 .1em}
.welcome .hello{font-size:19px;color:var(--green);font-weight:500;margin:0 0 14px}
.welcome .msg{max-width:600px;margin:0 auto 30px;text-align:left}
.welcome .msg p{margin:0 0 1em;white-space:pre-wrap}
.irisbank{display:inline-flex;align-items:center;gap:12px;margin:26px auto 8px;padding:10px 22px 10px 14px;background:var(--card);border:1px solid var(--line);border-radius:40px}
.irisbank svg{width:30px;height:36px;flex:none}
.irisbank b{font-size:22px;color:var(--wine);font-variant-numeric:tabular-nums}
.irisbank span{font-size:15px;color:var(--muted);text-align:left;line-height:1.4}
.irisend{margin:46px auto 0;padding-top:26px;border-top:1px solid var(--line);text-align:center}
.irisend p{margin:0 0 12px;color:var(--muted);font-size:15px}
.irisbtn{background:none;border:0;padding:6px;border-radius:50%;cursor:pointer;line-height:0;transition:transform .2s}
.irisbtn svg{width:64px;height:77px;transition:filter .3s,opacity .3s;filter:grayscale(.85);opacity:.55}
.irisbtn:hover svg,.irisbtn:focus-visible svg{filter:grayscale(.2);opacity:.9}
.irisbtn:focus-visible{outline:2px solid var(--wine);outline-offset:4px}
.irisbtn.given{cursor:default}
.irisbtn.given svg{filter:none;opacity:1}
.irisbtn.pop{animation:ipop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes ipop{0%{transform:scale(.8) rotate(-6deg)}60%{transform:scale(1.18) rotate(3deg)}100%{transform:scale(1)}}
.irisn{margin-top:8px;font-size:15px;color:var(--wine);min-height:1.6em}
.card .cover .fl{width:44px;height:44px}
#lb .fl{display:none}
footer .fl{width:1.1em;height:1.1em;vertical-align:-.2em}
@media (prefers-reduced-motion:reduce){.irisbtn.pop{animation:none}}

.filters input{padding-right:50px}
.sbox{position:relative;margin-bottom:14px}
.sbox input{margin-bottom:0}
.sbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;border-radius:50%;background:none;color:var(--wine);display:flex;align-items:center;justify-content:center}
.sbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.sbtn:hover{background:#6d1a2c1a}.sbtn:focus-visible{outline:2px solid var(--wine)}
article p,.cv li{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.welcome .msg,.welcome .msg p{text-align:center}
article h1{margin:.25em 0 .6em}
.welcome .msg{max-width:640px}
a.ext{color:var(--wine);white-space:nowrap;text-underline-offset:3px;font-size:.92em}
.filters input[type=search]::-webkit-search-cancel-button,.filters input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
@media (min-width:900px){main{padding-top:44px}.grid{gap:28px}}

/* ===== build 6 ===== */
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
button,.btn,.chip,nav a,.back,.gsw span,.card,.sbtn,.pn a{transition:transform .4s cubic-bezier(.22,.61,.36,1),box-shadow .4s ease,background-color .3s ease,color .3s ease,border-color .3s ease,opacity .3s ease}
button:not(.sbtn):not(.irisbtn):not(.n):not(.x):active{transform:scale(.97)}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 30px #0002}
.card .cover img,.card .cover video{transition:transform .8s cubic-bezier(.22,.61,.36,1)}
.card:hover .cover img,.card:hover .cover video{transform:scale(1.05)}
.chip:hover{transform:translateY(-1px)}
.back:hover{transform:translateX(-3px)}
#lb.open{opacity:1;visibility:visible;transition:opacity .35s ease,visibility 0s}
#lbm{transform:scale(.96);transition:transform .45s cubic-bezier(.22,.61,.36,1)}
#lb.open #lbm{transform:none}
#lbm>*{animation:lbin .4s cubic-bezier(.22,.61,.36,1)}
@keyframes lbin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.grid.stag .card{animation:rise .7s cubic-bezier(.22,.61,.36,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.welcome>*{animation:rise .8s cubic-bezier(.22,.61,.36,1) backwards}
.welcome>:nth-child(2){animation-delay:.08s}.welcome>:nth-child(3){animation-delay:.16s}.welcome>:nth-child(4){animation-delay:.24s}.welcome>:nth-child(5){animation-delay:.32s}.welcome>:nth-child(6){animation-delay:.42s}
.teabtn{display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:13px 32px;border-radius:40px;background:var(--green);color:var(--bg);font-size:16px;font-weight:500;letter-spacing:.05em;box-shadow:0 6px 16px #1f3a2e40}
.teabtn svg{width:22px;height:22px;flex:none}
.teabtn:hover{transform:translateY(-3px);box-shadow:0 12px 26px #1f3a2e55}
.teabtn:focus-visible{outline:2px solid var(--green);outline-offset:4px}
.qbox{position:relative;margin:0 0 32px;padding:26px 30px 24px;background:var(--card);border:1px solid var(--line);border-top:3px double var(--wine);border-radius:6px;text-align:center;box-shadow:0 8px 22px #1f3a2e14;overflow:hidden;animation:rise .8s cubic-bezier(.22,.61,.36,1) backwards}
.qbox::before{content:"“";position:absolute;top:-6px;left:16px;font:700 96px/1 Georgia,serif;color:var(--wine);opacity:.12;pointer-events:none}
.qlab{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--wine)}
.qlab .fl{color:#b8860b}
.qtext{margin:12px auto 0;max-width:640px;font-family:'Playfair Display','Chantelli Antiqua',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(20px,3.4vw,27px);line-height:1.45;color:var(--green);white-space:pre-wrap}
.qnote{margin:12px auto 0;max-width:600px;font-size:15px;line-height:1.6;color:var(--muted);white-space:pre-wrap}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:42px 0 8px;padding-top:26px;border-top:1px solid var(--line)}
.pn a{display:block;padding:14px 18px;border:1px solid var(--line);background:var(--card);border-radius:4px;text-decoration:none;color:var(--ink)}
.pn a:hover,.pn a:focus-visible{transform:translateY(-3px);box-shadow:0 10px 22px #0002;border-color:var(--green)}
.pn small{display:block;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--wine)}
.pn strong{display:block;margin-top:4px;color:var(--green);font-size:17px;line-height:1.35;font-weight:600}
